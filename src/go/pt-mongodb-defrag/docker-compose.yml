# docker-compose.yml
#
# Sharded MongoDB cluster for pt-mongodb-defrag testing.
# Targets MongoDB 7.0+ — the AutoMerger feature that this tool
# complements was introduced in 7.0.
#
# Quick start:
#   docker compose up -d                              # Start cluster
#   docker compose exec mongos /tool-scripts/generate-defrag-test-data.sh \
#     --uri "mongodb://admin:admin@localhost:27017/admin"   # Populate test data
#   docker compose down -v                            # Stop and clean everything
#
# See README.rst for full usage.

version: "3.9"

x-mongod:
  &mongod
  image: ${TEST_MONGODB_IMAGE:-mongo:8.0}
  restart: unless-stopped
  networks:
    - pt-defrag-net

x-mongod-config:
  &mongod-config
  image: ${TEST_MONGODB_IMAGE:-mongo:8.0}
  restart: unless-stopped
  networks:
    - pt-defrag-net

services:
  # ---------------------------------------------------------------------------
  # Config server replica set  (3 members)
  # ---------------------------------------------------------------------------
  cfg-1:
    <<: *mongod-config
    container_name: pt-defrag-cfg-1
    command: mongod --replSet cfg --configsvr --port 27017 --bind_ip all --oplogSize 16
    ports:
      - "${PT_DEFRAG_CFG1_PORT:-30001}:27017"

  cfg-2:
    <<: *mongod-config
    container_name: pt-defrag-cfg-2
    command: mongod --replSet cfg --configsvr --port 27017 --bind_ip all --oplogSize 16
    ports:
      - "${PT_DEFRAG_CFG2_PORT:-30002}:27017"

  cfg-3:
    <<: *mongod-config
    container_name: pt-defrag-cfg-3
    command: mongod --replSet cfg --configsvr --port 27017 --bind_ip all --oplogSize 16
    ports:
      - "${PT_DEFRAG_CFG3_PORT:-30003}:27017"

  # ---------------------------------------------------------------------------
  # Shard 1 replica set  (3 members)
  # ---------------------------------------------------------------------------
  rs1-1:
    <<: *mongod
    container_name: pt-defrag-rs1-1
    command: mongod --replSet rs1 --shardsvr --port 27017 --bind_ip all --oplogSize 16
    ports:
      - "${PT_DEFRAG_RS1_PRIMARY:-30011}:27017"

  rs1-2:
    <<: *mongod
    container_name: pt-defrag-rs1-2
    command: mongod --replSet rs1 --shardsvr --port 27017 --bind_ip all --oplogSize 16
    ports:
      - "${PT_DEFRAG_RS1_SECONDARY1:-30012}:27017"

  rs1-3:
    <<: *mongod
    container_name: pt-defrag-rs1-3
    command: mongod --replSet rs1 --shardsvr --port 27017 --bind_ip all --oplogSize 16
    ports:
      - "${PT_DEFRAG_RS1_SECONDARY2:-30013}:27017"

  # ---------------------------------------------------------------------------
  # Shard 2 replica set  (3 members)
  # ---------------------------------------------------------------------------
  rs2-1:
    <<: *mongod
    container_name: pt-defrag-rs2-1
    command: mongod --replSet rs2 --shardsvr --port 27017 --bind_ip all --oplogSize 16
    ports:
      - "${PT_DEFRAG_RS2_PRIMARY:-30021}:27017"

  rs2-2:
    <<: *mongod
    container_name: pt-defrag-rs2-2
    command: mongod --replSet rs2 --shardsvr --port 27017 --bind_ip all --oplogSize 16
    ports:
      - "${PT_DEFRAG_RS2_SECONDARY1:-30022}:27017"

  rs2-3:
    <<: *mongod
    container_name: pt-defrag-rs2-3
    command: mongod --replSet rs2 --shardsvr --port 27017 --bind_ip all --oplogSize 16
    ports:
      - "${PT_DEFRAG_RS2_SECONDARY2:-30023}:27017"

  # ---------------------------------------------------------------------------
  # Mongos (query router)
  # ---------------------------------------------------------------------------
  mongos:
    container_name: pt-defrag-mongos
    image: ${TEST_MONGODB_IMAGE:-mongo:8.0}
    restart: unless-stopped
    networks:
      - pt-defrag-net
    ports:
      - "${PT_DEFRAG_MONGOS_PORT:-30000}:27017"
    depends_on:
      - cfg-1
      - cfg-2
      - cfg-3
    volumes:
      - ./scripts:/tool-scripts:ro
    command: mongos --configdb cfg/cfg-1:27017,cfg-2:27017,cfg-3:27017 --port 27017 --bind_ip all

  # ---------------------------------------------------------------------------
  # Cluster initializer — runs once to set up replica sets, shards, and users
  # ---------------------------------------------------------------------------
  setup:
    container_name: pt-defrag-setup
    image: ${TEST_MONGODB_IMAGE:-mongo:8.0}
    networks:
      - pt-defrag-net
    depends_on:
      - mongos
    volumes:
      - ./docker/scripts:/scripts:ro
    entrypoint: [ "/scripts/setup.sh" ]
    restart: "no"

networks:
  pt-defrag-net:
    driver: bridge
